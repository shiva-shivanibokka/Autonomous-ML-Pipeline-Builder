# The whole stack, locally: frontend + FastAPI backend + MLflow tracking server.
# This is the supported way to run the project — one command, no Python or Node
# toolchain needed on the host.
#
#   docker compose up --build
#   App:       http://localhost:3000
#   API docs:  http://localhost:8000/docs
#   MLflow UI: http://localhost:5001
#
# Generated code runs in the API container's own subprocess sandbox, not on your
# machine. That is why ALLOW_LOCAL_EXEC defaults to true here and nowhere else.
# (Hosted, the API goes to Cloud Run and the frontend to Vercel — see
# deploy/README.md.)

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5001
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5001:5001"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Local dev overrides — the image defaults to production, which refuses to
      # boot without a real E2B key and a locked-down CORS allowlist.
      APP_ENV: development
      PORT: "8000"
      EXECUTION_BACKEND: ${EXECUTION_BACKEND:-subprocess}
      ALLOW_LOCAL_EXEC: ${ALLOW_LOCAL_EXEC:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      E2B_API_KEY: ${E2B_API_KEY:-}
      MLFLOW_TRACKING_URI: http://mlflow:5001
    volumes:
      - outputs_data:/app/outputs
      - upload_data:/app/uploads
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined at build time, so this is a build arg, not
        # a runtime environment variable. localhost, not the compose service
        # name: the browser makes these calls, and it resolves names on your
        # machine, not inside the compose network.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-0}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mlflow_data:
  outputs_data:
  upload_data:
