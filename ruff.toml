target-version = "py311"
line-length = 100
extend-exclude = ["web", "mlruns", "outputs", "uploads"]

[lint]
# Pyflakes (F) catches real bugs (undefined names, unused imports); pycodestyle (E)
# and isort (I) keep style consistent. Line-length is enforced by the formatter, not
# the linter, so E501 is off.
#
# S110/S112 flag `except: pass` and `except: continue`. This codebase leans on
# broad excepts around LLM output and sandboxed code, which is reasonable — but a
# swallowed exception with no log is how a sandbox quietly stopped returning its
# output CSV. Legitimate cases get an inline `noqa` with the reason.
select = ["E", "F", "I", "S110", "S112"]
ignore = ["E501"]

[lint.per-file-ignores]
# Tests assert on outcomes; a swallowed exception there is the point of the test.
"tests/*" = ["S110", "S112"]
